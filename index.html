<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Aku Mw Magang</title>
    <script>
      // Pasang tema tersimpan sebelum React dimuat, supaya halaman tidak sempat
      // tampil dengan tema bawaan lalu berkedip saat tema Gelap dipilih.
      try {
        document.documentElement.dataset.tema = JSON.parse(localStorage.getItem("akumwmagang-tema")) || "emas";
      } catch {
        document.documentElement.dataset.tema = "emas";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
